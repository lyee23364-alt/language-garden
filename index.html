<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="适配繁忙工作节奏的英语与德语学习、复习与进度追踪工具">
  <title>语伴｜英语与德语学习台</title>
  <style>
    :root{--ink:#142431;--paper:#f4f5ef;--card:#fff;--line:#d9ded8;--muted:#6e7a82;--lime:#d8ff59;--blue:#7183ff;--violet:#ead7ff;--orange:#ffdbc1;--shadow:0 24px 70px #23364212}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Microsoft YaHei",system-ui,sans-serif}button,select,textarea{font:inherit}button{color:inherit}.hidden{display:none!important}
    header{height:74px;padding:0 clamp(16px,5vw,70px);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:#f4f5efeb;border-bottom:1px solid var(--line);backdrop-filter:blur(16px)}
    .brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800}.brand-mark{width:40px;height:40px;display:grid;place-items:center;border-radius:13px 13px 13px 4px;background:var(--ink);color:var(--lime)}
    nav{display:flex;gap:4px;padding:4px;border-radius:13px;background:#e5e9e3}nav button{border:0;background:transparent;padding:9px 18px;border-radius:9px;cursor:pointer}nav button.active{background:#fff;font-weight:700;box-shadow:0 4px 12px #20303b10}
    .header-right{display:flex;align-items:center;gap:12px}.language{height:42px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 12px}.streak{font-weight:800}.streak small{display:block;font-size:10px;color:var(--muted);font-weight:500}
    .hero{min-height:380px;padding:clamp(42px,7vw,78px) clamp(20px,7vw,100px);display:grid;grid-template-columns:1.2fr minmax(320px,.8fr);gap:55px;align-items:center;background:var(--ink);color:#f7faed;position:relative;overflow:hidden}.hero:after{content:"EN · DE";position:absolute;right:-20px;bottom:-55px;font:900 clamp(90px,17vw,220px)/1 ui-monospace,monospace;color:#ffffff08;letter-spacing:-.1em}.hero-copy,.mode-box{position:relative;z-index:1}.eyebrow{font:650 12px ui-monospace,monospace;letter-spacing:.13em;color:#aab9c5}.hero h1{font-size:clamp(42px,6vw,74px);line-height:1.04;letter-spacing:-.055em;margin:16px 0}.hero h1 em{font-style:normal;color:var(--lime)}.hero-copy>p:last-child{max-width:520px;color:#bdc8ce;line-height:1.75}
    .mode-box{background:#f9faf3;color:var(--ink);border-radius:28px 28px 28px 7px;padding:24px;box-shadow:0 25px 60px #0003}.mode-head{display:flex;justify-content:space-between}.mode-head span{font-size:14px;color:var(--muted)}.mode-head strong{font:900 52px/1 ui-monospace,monospace}.mode-head small{font-size:11px}.segmented{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:22px 0 12px;padding:5px;background:#e8ece5;border-radius:14px}.segmented button{height:38px;border:0;border-radius:10px;background:transparent;cursor:pointer}.segmented button.active{background:#fff;font-weight:800;box-shadow:0 3px 10px #26343f12}.mode-note{font-size:13px;color:var(--muted)}.progress-line{height:7px;background:#dfe4dc;border-radius:10px;overflow:hidden;margin-top:18px}.progress-line i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}.progress-label{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
    main{padding:48px clamp(18px,5vw,72px) 90px}.section-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.section-title span{font:650 11px ui-monospace,monospace;letter-spacing:.13em;color:var(--muted)}.section-title h2{font-size:clamp(28px,4vw,43px);letter-spacing:-.045em;margin:7px 0 0}.section-title p{font-size:14px;color:var(--muted)}
    .modules{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.module{min-height:190px;padding:19px;border:1px solid var(--line);border-radius:22px;background:#fff;text-align:left;cursor:pointer;transition:.2s;position:relative}.module:hover,.module.active{transform:translateY(-4px);border-color:var(--ink);box-shadow:var(--shadow)}.module small{font:600 11px ui-monospace,monospace;color:#899399}.module-icon{width:49px;height:49px;display:grid;place-items:center;border-radius:16px;margin:25px 0 19px;font-size:23px}.module:nth-child(1) .module-icon{background:var(--lime)}.module:nth-child(2) .module-icon{background:#cbd2ff}.module:nth-child(3) .module-icon{background:var(--violet)}.module:nth-child(4) .module-icon{background:var(--orange)}.module strong{display:block;font-size:21px}.module p{margin:6px 0 0;font-size:13px;color:var(--muted)}
    .practice{margin-top:50px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;scroll-margin-top:90px}.practice-side h2{font-size:37px;letter-spacing:-.05em;margin:8px 0}.practice-side p{font-size:13px;color:var(--muted);line-height:1.6}.practice-nav{display:grid;margin-top:22px;border-top:1px solid var(--line)}.practice-nav button{height:52px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:0 11px;cursor:pointer}.practice-nav button.active{background:#fff;font-weight:800}.practice-card{min-height:505px;background:#fff;border:1px solid var(--line);border-radius:29px 29px 29px 8px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}.card-top{padding:21px 26px;display:flex;justify-content:space-between;color:var(--muted);font:650 11px ui-monospace,monospace;letter-spacing:.12em}.center{flex:1;display:grid;place-items:center;align-content:center;text-align:center;padding:28px}.sound{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:#f5f6f1;cursor:pointer}.big-word{font-size:clamp(49px,7vw,82px);letter-spacing:-.05em;margin:20px 0 2px}.phonetic{font-family:ui-monospace,monospace;color:var(--muted)}.reveal{margin-top:28px;border:0;border-bottom:1px solid;background:transparent;padding:7px 1px;cursor:pointer;font-weight:700}.answer{margin-top:25px}.answer strong{font-size:21px}.answer p{color:var(--muted)}.rating{padding:18px 22px;border-top:1px solid var(--line);background:#f0f2ed;display:flex;justify-content:space-between;align-items:center}.rating span{font-size:13px;color:var(--muted)}.rating div{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 15px;cursor:pointer}.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.pattern-body,.writing,.speaking-body{padding:48px clamp(25px,6vw,68px);flex:1}.pattern-body h3,.speaking-body h3{font-size:clamp(34px,5vw,58px);line-height:1.12;letter-spacing:-.045em;margin:18px 0}.hint{color:var(--muted);line-height:1.7}.task-box{margin-top:30px;padding:18px 20px;border-left:4px solid var(--blue);background:#f2f3ff}.reading{display:grid;grid-template-columns:1fr 1fr;min-height:505px}.article{padding:43px;background:var(--ink);color:#eaf0f2}.article h3{font-size:36px;letter-spacing:-.04em}.article p{font-size:17px;line-height:1.9;color:#c6d1d7}.translation{margin-top:20px;color:#aebbc4;line-height:1.7}.writing{display:flex;flex-direction:column}.writing h4{font-size:20px;line-height:1.5}.writing textarea{min-height:220px;flex:1;border:1px solid var(--line);border-radius:17px;padding:15px;line-height:1.7;resize:vertical}.writing footer{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.speaking{display:grid;grid-template-columns:1fr 310px}.speaking-body ul{line-height:2;color:var(--muted)}.starter{padding:15px;background:#f3f4ff;border-radius:15px;margin-top:26px}.timer{margin:26px 26px 26px 0;border-radius:28px 28px 28px 7px;background:var(--lime);display:grid;place-items:center;align-content:center;text-align:center}.timer.running{background:var(--blue);color:#fff}.timer strong{font:900 64px ui-monospace,monospace}.timer-controls{display:flex;gap:10px;margin-top:18px}.timer-controls button{width:50px;height:50px;border:0;border-radius:50%;background:var(--ink);color:#fff;cursor:pointer}
    .panel{min-height:600px}.panel h1{font-size:clamp(43px,7vw,75px);letter-spacing:-.06em;margin:15px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:35px 0}.stat{min-height:140px;padding:21px;border:1px solid var(--line);border-radius:21px;background:#fff;display:grid;align-content:space-between}.stat strong{font:900 40px ui-monospace,monospace}.list{display:grid;gap:10px}.list article{padding:17px 20px;border:1px solid var(--line);border-radius:16px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:8px}.list small{color:var(--muted)}.empty{padding:65px 20px;text-align:center;border:1px dashed #bac4bd;border-radius:24px;background:#fff;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;z-index:50;padding:13px 17px;border-radius:14px;background:var(--ink);color:#fff;box-shadow:0 16px 40px #0003}.privacy{margin-top:36px;padding:14px 18px;border-radius:14px;background:#e9ede7;color:#59666e;font-size:13px}
    @media(max-width:900px){nav{display:none}.hero{grid-template-columns:1fr}.modules{grid-template-columns:repeat(2,1fr)}.practice{grid-template-columns:1fr}.practice-nav{grid-template-columns:repeat(4,1fr)}.practice-nav button{text-align:center}.reading{grid-template-columns:1fr}.speaking{grid-template-columns:1fr}.timer{min-height:280px;margin:0 24px 24px}}
    @media(max-width:560px){header{height:66px}.streak{display:none}.hero{padding-top:40px;gap:28px}.mode-box{padding:18px}.modules{gap:9px}.module{min-height:165px;padding:14px}.section-title p{display:none}.practice-card{border-radius:22px 22px 22px 6px}.rating{align-items:flex-start;flex-direction:column;gap:12px}.rating div{display:grid;grid-template-columns:repeat(3,1fr);width:100%}.reading .article,.writing,.pattern-body,.speaking-body{padding:30px 22px}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.list article{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark">芽</span><span>语伴</span></div>
    <nav aria-label="主要页面"><button class="active" data-panel="learn">学习</button><button data-panel="review">复习 <b id="dueBadge">0</b></button><button data-panel="history">记录</button></nav>
    <div class="header-right"><select id="language" class="language" aria-label="选择语言"><option value="english">🇬🇧 英语</option><option value="german">🇩🇪 德语</option></select><div class="streak"><span id="streak">0</span> 天<small>连续学习</small></div></div>
  </header>
  <section id="learnPanel">
    <div class="hero">
      <div class="hero-copy"><div class="eyebrow" id="dateLabel"></div><h1>早上好，<br><em>今天学轻一点。</em></h1><p>工作时间 10:50–19:50。主练习放在上班前，晚上只做自愿加餐；忙时缩短，不因中断而放弃。</p></div>
      <aside class="mode-box"><div class="mode-head"><span>今天的节奏</span><strong><span id="modeMinutes">35</span><small> MIN</small></strong></div><div class="segmented" id="modeTabs"><button class="active" data-mode="normal">正常</button><button data-mode="busy">忙碌</button><button data-mode="overtime">加班</button></div><div class="mode-note" id="modeNote"></div><div class="progress-line"><i id="weekBar"></i></div><div class="progress-label"><span>本周进度</span><b id="weekLabel">0 / 180 分钟</b></div></aside>
    </div>
    <main>
      <div class="section-title"><div><span>CHOOSE A MODULE</span><h2>今天练什么？</h2></div><p>选一个模块即可开始，不需要全部完成。</p></div>
      <div class="modules" id="moduleCards">
        <button class="module active" data-module="words"><small>01 · RECALL</small><span class="module-icon">Aa</span><strong>单词</strong><p>主动回忆高频表达</p></button>
        <button class="module" data-module="patterns"><small>02 · BUILD</small><span class="module-icon">「」</span><strong>句型</strong><p>替换成自己的真实句子</p></button>
        <button class="module" data-module="reading"><small>03 · OUTPUT</small><span class="module-icon">文</span><strong>读写</strong><p>短输入转为主动输出</p></button>
        <button class="module" data-module="speaking"><small>04 · SPEAK</small><span class="module-icon">◉</span><strong>口语</strong><p>用 60 秒组织表达</p></button>
      </div>
      <section class="practice" id="practice">
        <aside class="practice-side"><span class="eyebrow" style="color:var(--muted)">TODAY'S PRACTICE</span><h2 id="practiceTitle">单词</h2><p id="levelLabel"></p><div class="practice-nav" id="practiceNav"><button class="active" data-module="words">单词</button><button data-module="patterns">句型</button><button data-module="reading">读写</button><button data-module="speaking">口语</button></div></aside>
        <div id="practiceContent"></div>
      </section>
      <div class="privacy">进度只保存在当前浏览器中，不会上传个人记录。更换设备或清理浏览器数据后记录会重置。</div>
    </main>
  </section>
  <main id="reviewPanel" class="panel hidden"><span class="eyebrow" style="color:var(--muted)">SPACED REVIEW</span><h1>该复习的，<br>现在见。</h1><div id="reviewList" class="list"></div></main>
  <main id="historyPanel" class="panel hidden"><span class="eyebrow" style="color:var(--muted)">YOUR PROGRESS</span><h1>每次回来，<br>都算数。</h1><div class="stats"><div class="stat"><small>累计分钟</small><strong id="totalMinutes">0</strong></div><div class="stat"><small>学习天数</small><strong id="studyDays">0</strong></div><div class="stat"><small>完成次数</small><strong id="sessionCount">0</strong></div></div><div id="historyList" class="list"></div></main>
  <div id="toast" class="toast hidden" role="status"></div>
  <script>
    const DATA={
      english:{label:'英语',locale:'en-US',level:'四级基础 · 向主动表达过渡',words:[['sustain','/səˈsteɪn/','维持；使持续','A small routine is easier to sustain.'],['workload','/ˈwɜːkləʊd/','工作量','My workload is heavier at the end of the month.'],['adjust','/əˈdʒʌst/','调整；适应','I adjust my plan when I need to work late.'],['consistent','/kənˈsɪstənt/','持续稳定的','Being consistent matters more than being perfect.'],['worthwhile','/ˌwɜːθˈwaɪl/','值得投入的','Ten focused minutes can still be worthwhile.']],patterns:[['If I ___, I will ___ instead.','如果我……，我会改为……','If I work late, I will review five words instead.','把 work late 换成你最近真实遇到的情况。'],['What matters most is ___.','最重要的是……','What matters most is keeping the routine alive.','写下你学习语言时最看重的一件事。'],['I used to ___, but now I ___.','我过去……，但现在……','I used to avoid speaking, but now I practise for one minute.','用这个句型说出一个真实变化。']],reading:['Small routines survive busy weeks','A sustainable learning plan does not depend on perfect evenings. On busy days, a short review keeps the memory active. On normal days, deeper practice builds confidence. The goal is not to study as much as possible, but to return often enough that the language remains familiar.','可持续的学习计划并不依赖每一个完美的夜晚。忙碌时，短暂复习可以保持记忆活跃；正常时，更深入的练习会建立信心。','请用 5 句英语概括短文，并写出你下次加班时会怎样调整。'],speaking:['Describe your weekday learning routine',['When do you usually study?','What do you do on a busy day?','Why are you learning English?'],'On weekdays, I usually study before work. When I am busy, I...']},
      german:{label:'德语',locale:'de-DE',level:'A1 起步 · 日常表达优先',words:[['der Alltag','[ˈalˌtaːk]','日常生活','Deutsch gehört langsam zu meinem Alltag.'],['dennoch','[ˈdɛnɔx]','尽管如此；仍然','Ich bin müde, dennoch lerne ich fünf Minuten.'],['schaffen','[ˈʃafn̩]','完成；做到','Heute schaffe ich eine kurze Übung.'],['wiederholen','[viːdɐˈhoːlən]','复习；重复','Ich wiederhole die neuen Wörter.'],['die Gewohnheit','[ɡəˈvoːnhaɪ̯t]','习惯','Lernen wird zu einer Gewohnheit.']],patterns:[['Normalerweise ___ ich um ___.','我通常在……做……','Normalerweise lerne ich um Viertel vor zehn.','填入你的真实学习时间。'],['Wenn ich viel Arbeit habe, ___.','当我工作很多时……','Wenn ich viel Arbeit habe, wiederhole ich nur fünf Wörter.','说出你加班时的保底动作。'],['Ich lerne Deutsch, weil ___.','我学德语，因为……','Ich lerne Deutsch, weil ich in Deutschland leben möchte.','补全你自己的真实原因。']],reading:['Fünf Minuten sind genug','An einem langen Arbeitstag habe ich wenig Zeit. Trotzdem lerne ich fünf Minuten Deutsch. Ich höre drei Sätze, spreche sie nach und schreibe einen eigenen Satz. So bleibt Deutsch ein Teil meines Alltags.','在漫长的工作日里，我时间很少。尽管如此，我仍学习五分钟德语。我听三个句子，跟读它们，再写一个自己的句子。','请仿照短文，用 5–8 句德语描述你的工作日学习安排。'],speaking:['Mein Lerntag',['Wann lernst du?','Was machst du, wenn du müde bist?','Warum lernst du Deutsch?'],'An einem normalen Tag lerne ich vor der Arbeit. Wenn ich müde bin, ...']}
    };
    const MODES={normal:[35,'主语言 25 分钟 + 复习 10 分钟'],busy:[15,'听读 10 分钟 + 输出 5 分钟'],overtime:[5,'听 3 分钟 + 跟读 1 分钟 + 写 1 句']};
    const NAMES={words:'单词',patterns:'句型',reading:'读写',speaking:'口语'};
    let state={language:localStorage.getItem('yg-language')||'english',mode:localStorage.getItem('yg-mode')||'normal',module:'words',word:0,pattern:0,timer:60,timerId:null,revealed:false};
    const readStore=()=>JSON.parse(localStorage.getItem('yg-progress')||'{"sessions":[],"reviews":[]}');
    const writeStore=x=>localStorage.setItem('yg-progress',JSON.stringify(x));
    const toast=t=>{const el=document.querySelector('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toast.id);toast.id=setTimeout(()=>el.classList.add('hidden'),2200)};
    function today(){return new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date())}
    function saveSession(module,note='',score=null){const d=readStore();d.sessions.unshift({id:Date.now(),date:new Date().toISOString(),language:state.language,module,mode:state.mode,duration:MODES[state.mode][0],note,score});writeStore(d);toast('已保存到当前浏览器');updateStats()}
    function addReview(key,prompt,answer,rating,module){const d=readStore(),now=Date.now(),days=rating==='easy'?7:rating==='hard'?1:0;const found=d.reviews.find(x=>x.key===key);const item={key,prompt,answer,module,language:state.language,due:now+days*86400000};if(found)Object.assign(found,item);else d.reviews.push(item);writeStore(d);toast(days?`${days} 天后再复习`:'已加入本次复习');nextItem();updateStats()}
    function nextItem(){state.revealed=false;if(state.module==='words')state.word=(state.word+1)%DATA[state.language].words.length;if(state.module==='patterns')state.pattern=(state.pattern+1)%DATA[state.language].patterns.length;renderPractice()}
    function setModule(m,scroll=false){state.module=m;state.revealed=false;document.querySelectorAll('[data-module]').forEach(x=>x.classList.toggle('active',x.dataset.module===m));document.querySelector('#practiceTitle').textContent=NAMES[m];renderPractice();if(scroll)document.querySelector('#practice').scrollIntoView({behavior:'smooth'})}
    function speak(t){if(!speechSynthesis)return toast('当前浏览器不支持朗读');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=DATA[state.language].locale;u.rate=.86;speechSynthesis.speak(u)}
    function renderPractice(){const d=DATA[state.language],root=document.querySelector('#practiceContent');if(state.module==='words'){const w=d.words[state.word];root.innerHTML=`<article class="practice-card"><div class="card-top"><span>WORD ${state.word+1} / ${d.words.length}</span><span>${d.label}</span></div><div class="center"><button class="sound" aria-label="朗读">▶</button><h3 class="big-word">${w[0]}</h3><p class="phonetic">${w[1]}</p><button class="reveal">${state.revealed?'隐藏释义':'显示释义'}</button>${state.revealed?`<div class="answer"><strong>${w[2]}</strong><p>${w[3]}</p></div>`:''}</div><div class="rating"><span>这次想起来了吗？</span><div><button class="btn" data-rate="again">再来</button><button class="btn" data-rate="hard">有点难</button><button class="btn primary" data-rate="easy">记住了</button></div></div></article>`;root.querySelector('.sound').onclick=()=>speak(w[0]);root.querySelector('.reveal').onclick=()=>{state.revealed=!state.revealed;renderPractice()};root.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>addReview(`${state.language}-w-${w[0]}`,w[0],`${w[2]} · ${w[3]}`,b.dataset.rate,'words'))}
      else if(state.module==='patterns'){const p=d.patterns[state.pattern];root.innerHTML=`<article class="practice-card"><div class="card-top"><span>PATTERN ${state.pattern+1} / ${d.patterns.length}</span><span>${d.label}</span></div><div class="pattern-body"><span class="eyebrow" style="color:var(--muted)">BUILD YOUR SENTENCE</span><h3>${p[0]}</h3><p class="hint">${p[1]}</p><button class="reveal">${state.revealed?'隐藏示例':'查看示例'}</button>${state.revealed?`<div class="task-box"><strong>${p[2]}</strong><p>${p[3]}</p></div>`:''}</div><div class="rating"><span>完成一次真实替换</span><div><button class="btn" data-rate="again">再练</button><button class="btn" data-rate="hard">有点难</button><button class="btn primary" data-rate="easy">完成</button></div></div></article>`;root.querySelector('.reveal').onclick=()=>{state.revealed=!state.revealed;renderPractice()};root.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>addReview(`${state.language}-p-${state.pattern}`,p[0],p[2],b.dataset.rate,'patterns'))}
      else if(state.module==='reading'){const r=d.reading;root.innerHTML=`<article class="practice-card reading"><section class="article"><span class="eyebrow">SHORT READING</span><h3>${r[0]}</h3><p>${r[1]}</p><button class="reveal" id="translate">查看中文</button><div id="translation" class="translation hidden">${r[2]}</div></section><section class="writing"><span class="eyebrow" style="color:var(--muted)">YOUR OUTPUT</span><h4>${r[3]}</h4><textarea id="draft" placeholder="在这里写下你的回答……"></textarea><footer><small id="count">0 字符</small><button class="btn primary" id="saveWriting">保存练习</button></footer></section></article>`;const ta=root.querySelector('#draft');ta.oninput=()=>root.querySelector('#count').textContent=`${ta.value.length} 字符`;root.querySelector('#translate').onclick=()=>root.querySelector('#translation').classList.toggle('hidden');root.querySelector('#saveWriting').onclick=()=>saveSession('reading',ta.value)}
      else{const s=d.speaking;root.innerHTML=`<article class="practice-card speaking"><section class="speaking-body"><span class="eyebrow" style="color:var(--muted)">60-SECOND SPEAKING</span><h3>${s[0]}</h3><ul>${s[1].map(x=>`<li>${x}</li>`).join('')}</ul><div class="starter"><small>开头参考</small><p>${s[2]}</p></div></section><aside class="timer ${state.timerId?'running':''}"><strong id="timerValue">${state.timer}</strong><small>秒</small><div class="timer-controls"><button id="timerToggle">${state.timerId?'Ⅱ':'▶'}</button><button id="timerReset">↺</button></div><button class="btn primary" id="saveSpeaking" style="margin-top:18px">保存口语练习</button></aside></article>`;root.querySelector('#timerToggle').onclick=toggleTimer;root.querySelector('#timerReset').onclick=resetTimer;root.querySelector('#saveSpeaking').onclick=()=>saveSession('speaking','60 秒口语练习')}
    }
    function toggleTimer(){if(state.timerId){clearInterval(state.timerId);state.timerId=null;renderPractice();return}state.timerId=setInterval(()=>{state.timer--;const el=document.querySelector('#timerValue');if(el)el.textContent=state.timer;if(state.timer<=0){clearInterval(state.timerId);state.timerId=null;toast('60 秒完成！');renderPractice()}},1000);renderPractice()}
    function resetTimer(){clearInterval(state.timerId);state.timerId=null;state.timer=60;renderPractice()}
    function updateStats(){const d=readStore(),sessions=d.sessions,minutes=sessions.reduce((a,x)=>a+x.duration,0),days=new Set(sessions.map(x=>x.date.slice(0,10))).size,due=d.reviews.filter(x=>x.due<=Date.now());document.querySelector('#streak').textContent=days;document.querySelector('#dueBadge').textContent=due.length;document.querySelector('#weekLabel').textContent=`${minutes} / 180 分钟`;document.querySelector('#weekBar').style.width=Math.min(100,minutes/180*100)+'%';document.querySelector('#totalMinutes').textContent=minutes;document.querySelector('#studyDays').textContent=days;document.querySelector('#sessionCount').textContent=sessions.length;document.querySelector('#reviewList').innerHTML=due.length?due.map(x=>`<article><div><strong>${x.prompt}</strong><small>${x.answer}</small></div><button class="btn" data-review="${x.key}">开始复习</button></article>`).join(''):'<div class="empty">暂无到期内容。练习单词和句型后，复习项目会出现在这里。</div>';document.querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const x=d.reviews.find(i=>i.key===b.dataset.review);state.language=x.language;document.querySelector('#language').value=state.language;showPanel('learn');setModule(x.module,true)});document.querySelector('#historyList').innerHTML=sessions.length?sessions.map(x=>`<article><div><strong>${DATA[x.language].label} · ${NAMES[x.module]}</strong><small>${x.note||MODES[x.mode][1]}</small></div><time>${new Date(x.date).toLocaleString('zh-CN')} · ${x.duration} 分钟</time></article>`).join(''):'<div class="empty">完成第一次练习后，记录会保存在这里。</div>'}
    function showPanel(name){document.querySelector('#learnPanel').classList.toggle('hidden',name!=='learn');document.querySelector('#reviewPanel').classList.toggle('hidden',name!=='review');document.querySelector('#historyPanel').classList.toggle('hidden',name!=='history');document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('active',x.dataset.panel===name));updateStats()}
    function syncHeader(){const m=MODES[state.mode];document.querySelector('#modeMinutes').textContent=m[0];document.querySelector('#modeNote').textContent=m[1];document.querySelector('#levelLabel').textContent=DATA[state.language].level;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===state.mode));document.querySelector('#dateLabel').textContent=`${today()} · ${DATA[state.language].level}`}
    document.querySelector('#language').value=state.language;document.querySelector('#language').onchange=e=>{state.language=e.target.value;state.word=0;state.pattern=0;localStorage.setItem('yg-language',state.language);syncHeader();renderPractice()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;localStorage.setItem('yg-mode',state.mode);syncHeader()});document.querySelectorAll('[data-module]').forEach(b=>b.onclick=()=>setModule(b.dataset.module,b.closest('.modules')!==null));document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>showPanel(b.dataset.panel));document.querySelector('#dateLabel').textContent=today();syncHeader();setModule('words');updateStats();
  </script>
</body>
</html>
